[project]
name = "tts-erp"
version = "2.0.0"
description = "TikTok Shop ERP service (HTTP proxy + local persistence)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "httpx>=0.27",
    "anyio>=4.0",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "structlog>=24.1",
    "minio>=7.2",  # SPU image storage (tech-doc/procurement-ui-redesign.md §5)
    "cryptography>=50.0",  # oauth-receiver merged (Fernet decryption)
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff.lint.per-file-ignores]
# tts_erp.py is the LEGACY stdlib service (not the running prod service —
# FastAPI in tdd/ is). It is scheduled for full retirement in Wave 4 of
# plans/review-remediation-2026-08.md; its pre-existing lint debt
# (E402 import-after-env-load, S104/S310 urlopen audits, S608, S110)
# is tracked there, not fixed piecemeal.
"tts_erp.py" = ["E402", "S104", "S310", "S608", "S110"]
# Test suites use hardcoded dummy credentials/tokens (access_token="t",
# app_secret="sec", …) as fixtures — not real secrets by construction.
"tdd/test_*.py" = ["S105", "S106"]
"tests/**/*.py" = ["S105", "S106"]
"analytics_sync/tests/*.py" = ["S105", "S106"]