# A generic, single-database alembic configuration.
# sqlalchemy.url is set programmatically in env.py from TTS_ERP_DB_URL env
# var (because the password may contain '%' which breaks configparser
# interpolation if we put it here directly).

[alembic]
# Path to migration scripts (relative to alembic.ini location).
script_location = alembic
# sqlalchemy.url is set in env.py from TTS_ERP_DB_URL env var.

# Template used to generate migration file names (with timestamp).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path adjustment so alembic can import app modules.
prepend_sys_path = .

# Timezone for `create_date` column when generating revisions.
timezone = UTC

# Max identifier length.
truncate_slug_length = 40

# Set in env.py from TTS_ERP_DB_URL env var. Placeholder avoids interpolation.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
