# tts-erp application log rotation (unprivileged).
#
# Runs from the systemd *user* timer tts-erp-logrotate.timer:
#   /usr/sbin/logrotate -s ~/.local/state/tts-erp-logrotate.status \
#       /home/schan/tts-erp/scripts/logrotate/tts-erp.conf
# No root involved — every file below belongs to the service user.
#
# copytruncate (not rename) is REQUIRED: logs/stdout.log and stderr.log
# are held open for the whole lifetime of tts-erp.service by systemd
# (StandardOutput=append:...). Renaming would leave the service writing
# into the renamed inode forever. copytruncate copies the content aside
# and truncates the original in place, so the open FD keeps appending
# to the same inode. Known trade-off: lines written between cp and
# truncate are lost (sub-second window) — acceptable for access logs.
#
# logs/sync_worker.log is intentionally NOT listed: it self-rotates via
# RotatingFileHandler (5 MiB x 5, tts_erp_v2/sync_worker/main.py) and
# external rotation would fight the handler's byte accounting.

/home/schan/tts-erp/logs/stdout.log
/home/schan/tts-erp/logs/stderr.log
/home/schan/tts-erp/logs/watchdog.log {
    # Size gate checked on every timer run: rotate only past 20 MiB so
    # quiet files (stderr, watchdog) are left alone. stdout grows ~10 MB/day
    # → rotates about every other day, bounded at ~100 MB with rotate 5.
    size 20M
    rotate 5
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
}
