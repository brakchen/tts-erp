# PG 容器的事实声明（2026-11-09 实测 + Chief ①-a 记录）
#
# 为什么必须有这个文件：
#   install.sh 里 docker run=0 / docker create=0 ⇒ 端口绑定的 owner
#   （-p 5432:5432）只存在于服务器上的 docker 命令历史里，仓库无声明。
#   ⇒ 不固化 ⇒ 下一次重建会回到 0.0.0.0 ⇒ 收口是一次性的，不是持久的。
#
# ★ 每个 env 键都必须标 value_source：
#   2026-11-09 实测踩坑 —— 第一版 rebuild.sh 从 runtime.env 取 POSTGRES_PASSWORD，
#   而 runtime.env 里【根本没有这个键】（它只在容器的 Env 里）⇒ 重建时口令为空
#   ⇒ 容器起不来 ⇒ 数据不可见 ⇒ 彻底失联。
#   ⇒ 「用空值重建」比「重建失败」更糟：后者只是没做成，前者看起来"完成了"，
#      现场却会以为"只是服务没起来"。
#   ⇒ required_at_rebuild: true 的键取不到 ⇒ 必须中止，不得用空值/默认值继续。
#
# 事实来源：docker inspect postgres（2026-11-09T02:31 CST）
spec:
  name: postgres
  image: postgres:18
  restart_policy: unless-stopped
  network: postgres_default
  ports:
    # ★ 收口后的目标绑定（当前运行时仍是 HostIp 空 = 0.0.0.0，收口未执行）
    - "127.0.0.1:5432:5432"
  volumes:
    # ★ 必须挂到 /var/lib/postgresql（不是 /var/lib/postgresql/data）
    #   PG18 镜像布局是 PGDATA=/var/lib/postgresql/18/docker，挂错 ⇒ 数据看不见
    - "1b98586f4daf2b00092c4c9e700d411d15d8dbfa599fd228a0e4c994784953a2:/var/lib/postgresql"
  env:
    POSTGRES_USER:
      value_source: container_env      # container_env | runtime_env | systemd_credential | generated
      required_at_rebuild: true
    POSTGRES_PASSWORD:
      value_source: container_env      # ★ 实测：runtime.env 里没有这个键
      required_at_rebuild: true       # ★ 取不到必须中止
    PGDATA:
      value_source: fixed
      value: /var/lib/postgresql/18/docker
      required_at_rebuild: true
    PG_MAJOR:
      value_source: image_default
      required_at_rebuild: false
    PG_VERSION:
      value_source: image_default
      required_at_rebuild: false
    LANG:
      value_source: image_default
      required_at_rebuild: false
    PATH:
      value_source: image_default
      required_at_rebuild: false
    GOSU_VERSION:
      value_source: image_default
      required_at_rebuild: false
  pgdata: /var/lib/postgresql/18/docker
  # 重建后必须「可观测等价」逐项比对（最后一项最易漏，正是 2026-11-09 踩的那项）
  observational_equivalence:
    - ports
    - mounts
    - network
    - pgdata
    - env_keys
    - env_value_sources
  notes:
    - "容器内 socket（local all all trust）供 docker exec pg_dump 使用，不经端口映射"
    - "宿主机 → 容器 5432 走 docker 端口映射 ⇒ 源地址被 MASQUERADE 成 172.19.0.1"
    - "⇒ pg_hba 的地址限源在此路径上无效；访问控制必须做在端口绑定层"
