<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视频发布 · tts-erp</title>
  <link rel="stylesheet" href="../../static/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="../../static/css/tokens.css?v={{ css_version('tokens.css') }}">
  <link rel="stylesheet" href="../../static/css/common.css?v={{ css_version('common.css') }}">
  <link rel="stylesheet" href="../../static/css/video-publish.css?v={{ css_version('video-publish.css') }}">
</head>
<body>
{{ sidebar(current_page) }}
<header class="op-header"><div class="op-header-row"><div class="op-header-titles"><span class="op-eyebrow">VIDEO DISPATCH · TikTok</span><h1 class="op-title">视频发布</h1><p>上传一个视频，系统将按队列串行发布到 TikTok。</p></div><div class="op-identity" id="publish-device-status">设备状态加载中…</div></div></header>
<main class="page-main publish-main">
  <div id="publish-notice" aria-live="polite"></div>
  <section class="publish-rail-section"><div class="section-title">当前发布轨道</div><div id="publish-refresh-status" role="status" hidden></div><div id="publish-rail" class="publish-rail" aria-label="发布阶段"><span data-stage="downloading">MINIO</span><i>━━</i><span data-stage="staging_device">手机相册</span><i>━━</i><span data-stage="waiting_artemis">Artemis</span><i>━━</i><span data-stage="tiktok">TikTok</span><i>━━</i><span data-stage="cleaning">清理</span></div><div id="publish-rail-summary">当前无运行任务</div><div class="rail-id"><span id="active-artemis-id">尚未创建</span> <button class="btn-secondary" data-copy-artemis-id="">复制</button></div></section>
  <section class="publish-workbench"><div class="publish-form"><h2>新建发布任务</h2><label id="publish-video-drop" class="drop-zone" for="publish-video-file"><strong>选择 MP4 视频</strong><small id="publish-size-hint">服务端大小上限加载中…</small><input id="publish-video-file" type="file" accept="video/mp4,.mp4"></label><div id="publish-file-name"></div><video id="publish-video-preview" controls muted playsinline hidden></video><label class="caption-label" for="publish-caption">发布文案 <span id="publish-caption-count" aria-live="polite">0 / 4000</span></label><textarea id="publish-caption" rows="7" maxlength="4000" placeholder="保留换行、emoji 和话题标签"></textarea></div><aside class="publish-summary"><h2>本次投递</h2><dl><dt>App</dt><dd>TikTok</dd><dt>设备</dt><dd id="publish-target-device">—</dd><dt>相册</dt><dd id="publish-target-album">—</dd><dt>文件</dt><dd id="publish-summary-file">—</dd><dt>文案</dt><dd id="publish-summary-caption">0 字</dd></dl><button id="publish-submit" class="btn-primary" disabled>上传并加入发布队列</button><small>加入队列后不能修改视频和文案。</small></aside></section>
  <section class="publish-history"><div class="history-toolbar"><h2>任务记录</h2><div><select id="publish-refresh-mode"><option value="smart">自动刷新：智能</option><option value="2">2 秒</option><option value="5">5 秒</option><option value="10">10 秒</option><option value="30">30 秒</option><option value="off">关闭</option></select><button id="publish-refresh-now" class="btn-secondary">立即刷新</button><span id="publish-last-refreshed"></span></div></div><div class="filter-tabs"><button data-task-filter="">全部</button><button data-task-filter="pending">排队</button><button data-task-filter="running">执行中</button><button data-task-filter="failed">失败</button><button data-task-filter="needs_review">需核验</button><button data-task-filter="succeeded">成功</button><button data-task-filter="cancelled">已取消</button></div><div class="table-scroll"><table class="op-table"><thead><tr><th class="op-th">状态</th><th class="op-th">视频</th><th class="op-th">Artemis ID</th><th class="op-th">时间</th><th class="op-th">操作</th></tr></thead><tbody id="publish-task-list"><tr><td colspan="5" class="op-empty">加载中…</td></tr></tbody></table></div></section>
</main>
<dialog id="publish-task-drawer"><button id="publish-drawer-close" class="drawer-close" aria-label="关闭详情">×</button><div id="publish-drawer-content"></div><div id="publish-drawer-actions"></div></dialog>
<script src="../../static/js/video-publish.js?v={{ js_version('video-publish.js') }}" defer></script>
</body></html>
